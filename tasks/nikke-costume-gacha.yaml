name: NIKKE Costume Gacha
enabled: true
description: Draw costume from limited-time event in NIKKE

steps:
  - action:
      type: click
    target:
      type: template
      path: templates/nikke/more.png
      threshold: 0.8
    timeout_ms: 10000
    on_fail: retry

  - action:
      type: wait
      ms: 2000
    target:
      type: coordinate
      x: 0
      y: 0
    timeout_ms: 3000

  - action:
      type: click
    target:
      type: template
      path: templates/nikke/costume_draw_button.png
      threshold: 0.8
    timeout_ms: 10000
    on_fail: retry

  - action:
      type: wait
      ms: 2000
    target:
      type: coordinate
      x: 0
      y: 0
    timeout_ms: 3000

  - action:
      type: click
    target:
      type: template
      path: templates/nikke/draw_button.png
      threshold: 0.8
    timeout_ms: 10000
    on_fail: retry

config:
  fail_strategy: retry
  retry_count: 3
